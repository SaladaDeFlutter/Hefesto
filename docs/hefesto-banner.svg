      <path d="M254 92 L259 78 L264 92 L278 97 L264 102 L259 116 L254 102 L240 97 Z" fill="#f5a524"/>
      <path d="M162 48 L165 38 L168 48 L178 51 L168 54 L165 64 L162 54 L152 51 Z" fill="#ff7a18"/>
      <path d="M152 96 L130 74" stroke="#f7c46c" stroke-width="3" stroke-linecap="round"/>
      <path d="M244 118 L270 136" stroke="#f7c46c" stroke-width="3" stroke-linecap="round"/>
      <path d="M128 128 L104 142" stroke="#f5a524" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <path d="M282 72 L304 62" stroke="#f5a524" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    </g>

    <path
      d="M56 96 H246 L226 126 H84 Z"
      fill="url(#steel)"
      stroke="#2a4064"
      stroke-width="2"
    />
    <path
      d="M246 96 C276 96 301 107 322 126 C294 123 270 121 246 121 Z"
      fill="url(#steel)"
      stroke="#2a4064"
      stroke-width="2"
    />
    <path
      d="M112 126 H198 L214 158 H96 Z"
      fill="url(#steel)"
      stroke="#2a4064"
      stroke-width="2"
    />
    <path
      d="M98 158 H206 L224 190 H78 Z"
      fill="url(#steel)"
      stroke="#2a4064"
      stroke-width="2"
    />
    <path
      d="M64 190 H238 L268 220 H34 Z"
