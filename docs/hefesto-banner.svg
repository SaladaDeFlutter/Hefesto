      stroke="#2a4064"
      stroke-width="2"
    />

    <path d="M70 104 H236" stroke="#7dd3fc" stroke-width="2" opacity="0.22"/>
    <path d="M78 198 H226" stroke="#f5a524" stroke-width="2" opacity="0.32"/>
    <path d="M146 142 H178" stroke="#f5a524" stroke-width="2" opacity="0.25"/>

    <g fill="none" stroke="#f5a524" stroke-width="2" opacity="0.55">
