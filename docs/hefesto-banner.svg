<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hefesto-title hefesto-desc">
  <title id="hefesto-title">Hefesto</title>
  <desc id="hefesto-desc">A forja de agentes opencode</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="0.55" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#0d1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.58">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#f5a524" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c46c"/>
      <stop offset="0.48" stop-color="#f5a524"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#213653"/>
      <stop offset="0.5" stop-color="#14233a"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wordGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#2a4064" opacity="0.5"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#dots)" opacity="0.38"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <circle cx="980" cy="172" r="166" fill="none" stroke="#2a4064" opacity="0.58"/>
    <circle cx="980" cy="172" r="122" fill="none" stroke="#2a4064" opacity="0.35" stroke-dasharray="3 10"/>
    <circle cx="980" cy="172" r="84" fill="none" stroke="#f5a524" opacity="0.12"/>

    <path d="M0 316 C210 260 350 338 590 302 C840 264 1000 244 1200 298" fill="none" stroke="#f5a524" opacity="0.13"/>
    <path d="M78 74 V286" stroke="#2a4064" opacity="0.55"/>
    <path d="M720 74 V286" stroke="#2a4064" opacity="0.35"/>

    <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#1c2a42"/>
  </g>

  <g transform="translate(78 92)">
    <text
      x="0"
      y="0"
      fill="#f5a524"
      font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="700"
      letter-spacing="5"
    >LOCAL-FIRST</text>

    <text
      x="0"
      y="82"
